name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # CI: Lint, build, and test both frontend and backend
  # ──────────────────────────────────────────────
  ci:
    name: CI — Install, Lint, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Backend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # Note: Add backend lint/test steps here when available.
      # Currently package.json has no lint script and test is a placeholder.
      # Uncomment below when real tests are added:
      # - name: Run backend tests
      #   run: npm test
      #   working-directory: backend

      # ── Frontend ──
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  # ──────────────────────────────────────────────
  # CD: Build Docker image, push to Docker Hub, deploy to EC2
  # Runs only on push to main (not on PRs)
  # ──────────────────────────────────────────────
  deploy-backend:
    name: CD — Deploy Backend to EC2
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webauth-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webauth-backend:${{ github.sha }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/webauth-backend:latest

            # Stop and remove the old container (if running)
            docker stop webauth-backend || true
            docker rm webauth-backend || true

            # Start new container with env vars
            docker run -d \
              --name webauth-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              -e PORT=${{ secrets.PORT }} \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -e REDIS_URL="${{ secrets.REDIS_URL }}" \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e SMTP_USER="${{ secrets.SMTP_USER }}" \
              -e SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e REFRESH_SECRET="${{ secrets.REFRESH_SECRET }}" \
              -e NODE_ENV=production \
              ${{ secrets.DOCKERHUB_USERNAME }}/webauth-backend:latest

            # Clean up old images
            docker image prune -f
